<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Análisis Matemático I</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script>try{var t=localStorage.getItem('ami-theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true,
        processEnvironments: true,
        tags: 'none',
        packages: {'[+]': ['ams', 'noerrors', 'mathtools', 'extpfeil']}
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        ignoreHtmlClass: 'no-mathjax'
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body>
  <div id="app">
    <header id="section-header">
      <nav id="top-nav">
        <button id="sidebar-toggle" aria-label="Mostrar índice de la sección">☰</button>
        <a href="/" id="nav-home" aria-label="Volver al índice">← Índice</a>
        <span id="nav-title"></span>
        <div id="nav-controls">
          <button id="theme-toggle" aria-label="Cambiar a tema oscuro" aria-pressed="false">🌙</button>
          <button id="nav-prev" aria-label="Sección anterior" disabled>‹</button>
          <button id="nav-next" aria-label="Sección siguiente" disabled>›</button>
        </div>
      </nav>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </header>

    <div id="sidebar-overlay"></div>

    <div id="section-layout">
      <aside id="sidebar">
        <nav id="sidebar-nav" aria-label="Contenido de la sección">
          <!-- Generated by seccion.ts -->
        </nav>
      </aside>
      <main id="section-content">
        <div id="content-tabs">
          <button id="tab-teoria" class="tab active" data-tab="teoria">Teoría</button>
          <button id="tab-ejercicios" class="tab" data-tab="ejercicios">Ejercicios</button>
        </div>
        <article id="content-body">
          <div class="content-loading">Cargando contenido…</div>
        </article>
        <nav id="section-footer-nav">
          <a id="footer-prev" href="#" class="hidden">← Sección anterior</a>
          <a id="footer-next" href="#" class="hidden">Sección siguiente →</a>
        </nav>
      </main>
    </div>
  </div>
  <script type="module" src="/src/seccion.ts"></script>
</body>
</html>
